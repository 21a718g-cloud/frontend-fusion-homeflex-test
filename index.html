<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; connect-src 'self' https: http:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'"><meta name="theme-color" content="#6d5dfc"><meta name="description" content="An original browser-local desktop for files, notes and website shortcuts. No account or cloud sync."><title>Fusion + HomeFlex Test</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="homeflex.css"><script src="homeflex.js" defer></script><script src="app.js" defer></script></head>
<body><div id="boot" role="status">Opening your workspace...</div><main id="workspace" aria-label="Desktop workspace"><header class="top"><div><span class="brand-mark" aria-hidden="true">F</span><strong>Fusion + HomeFlex Test</strong><span class="local-tag">SEPARATE TEST</span></div><button id="install">Install app</button><span id="connection">Preparing offline files</span><button id="profile-toggle" class="profile-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="profile-card" aria-label="Profile menu"></button></header><div id="profile-card" role="dialog" aria-label="Profile card" hidden></div><section id="desktop" aria-label="Desktop shortcuts"></section><div class="desktop-caption"><span>YOUR SPACE, WITHOUT THE NOISE</span><h1>A little desktop.<br>A lot of possibility.</h1><p>Files, ideas and favourite places.<br>Kept right here, in this browser.</p></div><section id="windows" aria-label="Open applications"></section></main><nav class="dock" aria-label="Taskbar"><div class="dock-left"><button id="launcher-toggle" aria-label="Open workspace launcher" title="Launcher">▦</button><button id="search-toggle" aria-label="Open global search" title="Search (Ctrl+K)">⌕</button></div><div id="dock-items" class="dock-centre"></div><button id="overflow-toggle" aria-label="More taskbar apps">•••</button><div class="dock-right"><button id="notifications" aria-label="Workspace notifications">♧</button><time id="clock"></time><button id="show-desktop" aria-label="Show or restore desktop" title="Show desktop">▤</button></div></nav><dialog id="overlay" aria-labelledby="overlay-title"><div id="overlay-content"></div></dialog><dialog id="dialog" aria-labelledby="dialog-title"><form id="dialog-form"><h2 id="dialog-title"></h2><div id="dialog-body"></div><footer><button type="button" id="dialog-cancel">Cancel</button><button id="dialog-ok" type="submit" class="primary">Confirm</button></footer></form></dialog><div id="menu" role="menu" hidden></div><div id="toast" role="status" aria-live="polite"></div><input id="file-input" type="file" hidden><input id="import-input" type="file" accept="application/json,.json" hidden><input id="profile-import-input" type="file" accept="application/json,.json" hidden><input id="wallpaper-input" type="file" accept="image/png,image/jpeg,image/webp" hidden></body></html>
